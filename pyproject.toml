[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-cli-agent"
version = "0.2.0"
description = "Browser perception and input control contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=15,<16", "Pillow>=12,<13"]

[project.scripts]
bca-lite = "bca.lite.cli:main"

[project.optional-dependencies]
assets = ["numpy>=2.4,<3"]
vision = ["numpy>=2.4,<3", "opencv-python-headless>=4.14,<5"]
lite = ["maafw==5.16.1", "numpy>=2.4,<3", "prompt-toolkit>=3.0.51,<4"]
dev = ["pytest>=8,<10", "mypy>=1.14,<3", "ruff>=0.9,<1", "build>=1.2,<2", "psutil>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bca = ["py.typed"]
"bca.lite" = ["resources/fixture/*.html", "resources/fixture/*.md", "resources/fixture/image/*.png", "resources/fixture/pipeline/*.json", "resources/quiz/*.html", "resources/quiz/*.js", "resources/quiz/*.md", "resources/quiz/*.json", "resources/quiz/image/*.png", "resources/quiz/pipeline/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["browser_integration: requires an explicitly configured local CDP browser"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "plugins/example", "examples"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

